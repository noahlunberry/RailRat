[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F439ZITx"

rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
# Larger RTT buffer so bursts of lidar data (rail_scan) do not stall the board
DEFMT_RTT_BUFFER_SIZE = "16384"