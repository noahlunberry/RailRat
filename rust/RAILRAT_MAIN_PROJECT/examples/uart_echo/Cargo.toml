[package]
name = "starter"
version = "0.1.0"
edition = "2024"



[dependencies]

embassy-stm32 = {
    version = "0.6.0",
    features = [
        "stm32f439zi",
        "memory-x",
        "time-driver-tim4",
    ]
}

embassy-executor = { 
    version = "0.10.0", 
    features = [
        "platform-cortex-m",
        "executor-thread",
    ] 
}

embassy-time = { 
    version = "0.5.1",
    features = [
        "tick-hz-32_768",
    ]
}

embassy-sync = { 
    version = "0.8.0", 
    features = [
        "defmt"
    ] 
}

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { 
    version = "0.7.7", 
    features = ["critical-section-single-core"] 
}

cortex-m-rt = "0.7.7"



[profile.release]
debug = 2